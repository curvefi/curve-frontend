approvedGitRepositories:
  - "**"

enableScripts: true

enableConstraintsChecks: true

nodeLinker: node-modules

# Workspace peers resolve through shared ui dependencies or hoisted tooling. Keep version conflicts and unreviewed upstream package warnings visible.
logFilters:
  - pattern: "@curvefi/curve-frontend@workspace:. doesn't provide vite (*), requested by *"
    level: discard # vite is hoisted from main, stellar and tests.
  - pattern: "@curvefi/evm-ui@workspace:packages/evm-ui doesn't provide {@tanstack/react-query,@types/react,react,react-dom,typescript,vite} (*), requested by *"
    level: discard # react/react-dom/react-query are hoisted from ui; @types/react/typescript from root; vite from main, stellar and tests.
  - pattern: "{@curvefi/legacy-ui@workspace:packages/legacy-ui,stellar@workspace:apps/stellar} doesn't provide {react,react-dom} (*), requested by *"
    level: discard # react/react-dom are hoisted from ui.
  - pattern: "@curvefi/tests@workspace:tests doesn't provide {@types/react-dom,react,react-dom,vitest} (*), requested by *"
    level: discard # react/react-dom are hoisted from ui; @types/react-dom/vitest are hoisted from root.
  - pattern: "@curvefi/ui@workspace:packages/ui doesn't provide {@tanstack/router-core,@types/react} (*), requested by *"
    level: discard # router-core is hoisted from stellar; @types/react is hoisted from root.
  - pattern: "@hot-wallet/sdk@npm:1.0.11 doesn't provide near-api-js (*), requested by *"
    level: discard # near-api-js is missing upstream, but our wallet integration uses neither Hot Wallet nor its NEAR selector.

npmMinimalAgeGate: 1440

npmPreapprovedPackages:
  - "@curvefi/llamalend-api"
  - "@curvefi/api"

yarnPath: .yarn/releases/yarn-4.17.1.cjs
