name: Restore cache
description: Restore the workspace .cache directory
runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      with:
        path: .cache
        key: >-
          cache-${{ github.job }}-${{ hashFiles(
            'yarn.lock',
            'tsconfig*.json',
            'apps/**/tsconfig*.json',
            'packages/**/tsconfig*.json',
            'tests/tsconfig*.json',
            'storybook/**/tsconfig*.json'
          ) }}-${{ github.sha }}
        restore-keys: |
          cache-${{ github.job }}-${{ hashFiles('yarn.lock', 'tsconfig*.json', 'apps/**/tsconfig*.json', 'packages/**/tsconfig*.json', 'tests/tsconfig*.json', 'storybook/**/tsconfig*.json') }}-
          cache-${{ github.job }}-
